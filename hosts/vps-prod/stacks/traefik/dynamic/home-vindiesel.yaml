http:
  routers:
    immich-photos:
      rule: "Host(`photos.int.vindiesel.vip`)"
      entryPoints:
        - websecure
      service: home-vindiesel
      middlewares:
        - int-vpn
      tls: {}

    immich-pictures:
      rule: "Host(`pictures.int.vindiesel.vip`)"
      entryPoints:
        - websecure
      service: home-vindiesel
      middlewares:
        - int-vpn
      tls: {}

    pelican:
      rule: "Host(`mcwings.int.vindiesel.vip`)"
      entryPoints:
        - websecure
      service: home-vindiesel
      middlewares:
        - int-vpn
      tls: {}

    # mangetout : PUBLIC (backend app mobile) — pas de middleware int-vpn.
    mangetout-pb:
      rule: "Host(`pb.vindiesel.vip`)"
      entryPoints:
        - websecure
      service: home-vindiesel
      tls: {}

    mangetout-ai:
      rule: "Host(`ai.vindiesel.vip`)"
      entryPoints:
        - websecure
      service: home-vindiesel
      tls: {}

    # Fast & Curious : addon PUBLIC (lecteurs hors tailnet). Le Traefik de vindiesel
    # ne laisse passer que les routes de l'addon sur ce nom.
    fnc:
      rule: "Host(`fnc.vindiesel.vip`)"
      entryPoints:
        - websecure
      service: home-vindiesel
      tls: {}

    # Fast & Curious interne : plugin Jellyfin et lecture, tailnet seulement (jeton du plugin).
    fnc-int-plugin:
      rule: "Host(`fnc.int.vindiesel.vip`) && (PathPrefix(`/plugin/`) || PathPrefix(`/play/`) || PathPrefix(`/videos/`))"
      entryPoints:
        - websecure
      service: home-vindiesel
      middlewares:
        - int-vpn
      priority: 100
      tls: {}

    # Fast & Curious interne : administration, tailnet + Authelia.
    fnc-int:
      rule: "Host(`fnc.int.vindiesel.vip`)"
      entryPoints:
        - websecure
      service: home-vindiesel
      middlewares:
        - int-vpn
        - authelia@docker
      tls: {}

  services:
    home-vindiesel:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://100.65.11.58:80"

  middlewares:
    int-vpn:
      ipAllowList:
        sourceRange:
          - "100.64.0.0/10"
