name: immich2

services:
  immich-server:
    container_name: immich2_server
    image: ghcr.io/immich-app/immich-server:v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.immich2.rule=Host(`pictures.int.vindiesel.vip`)"
      - "traefik.http.routers.immich2.entrypoints=web"
      - "traefik.http.services.immich2.loadbalancer.server.port=2283"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"
    environment:
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_DATA_LOCATION: /data/immich-2/library/postgres
      UPLOAD_LOCATION: /data/immich-2/library
      IMMICH_VERSION: v3.3.5
      LIBVA_DRIVER_NAME: iHD
    env_file:
      - .env
    volumes:
      - /data/immich-2/library:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  immich-machine-learning:
    container_name: immich2_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5-openvino@sha256:1dbac7f811b51b80c55ee0cf678e0089d3532c798f14a65747d5d7b473a4f9d6
    networks:
      - backend
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"
    environment:
      MACHINE_LEARNING_DEVICE: GPU
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - type: tmpfs
        target: /cache
        tmpfs:
          size: 2147483648
    restart: always
    healthcheck:
      disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: immich2_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    networks:
      - backend
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  database:
    container_name: immich2_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    networks:
      - backend
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    env_file:
      - .env
    volumes:
      - /data/immich-2/library/postgres:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    name: immich2_backend
  proxy:
    name: proxy
    external: true
