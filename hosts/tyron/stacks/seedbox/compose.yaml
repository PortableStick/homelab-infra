name: seedbox

services:
  # Tunnel ProtonVPN (WireGuard). TOUT le trafic de rTorrent passe par ce conteneur :
  # si le tunnel tombe, le kill-switch de gluetun coupe le trafic (pas de fuite d'IP).
  gluetun:
    container_name: seedbox_gluetun
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - proxy
    environment:
      TZ: "Europe/Paris"
      VPN_SERVICE_PROVIDER: "protonvpn"
      VPN_TYPE: "wireguard"
      # Serveur de sortie : Espagne (config Proton générée sur ES#44).
      SERVER_COUNTRIES: "Spain"
      # N'accepte que des serveurs Proton qui supportent le port forwarding.
      PORT_FORWARD_ONLY: "on"
      # Port forwarding NAT-PMP (exige "NAT-PMP" activé sur la config Proton).
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_UP_COMMAND: "/bin/sh /gluetun/set-rtorrent-port.sh {{PORTS}}"
      # Le serveur de controle de gluetun ecoute sur :8000 par defaut. rTorrent
      # partage cette pile reseau et y expose son nginx XMLRPC, egalement sur
      # 8000 : le nginx bouclait en "bind() failed (98: Address in use)" et le
      # conteneur restait unhealthy. On deplace gluetun, rTorrent garde ses
      # ports par defaut (8000 XMLRPC, 8001 sante, 8080 ruTorrent).
      HTTP_CONTROL_SERVER_ADDRESS: ":8010"
      # DNS : on garde le resolveur DoT interne de gluetun (defaut). Il sort par le
      # tunnel, donc aucune requete DNS ne part chez le FAI. Ne PAS figer ici le
      # resolveur interne d'un serveur Proton donne (10.2.0.1) : gluetun choisit son
      # serveur lui-meme parmi ceux de SERVER_COUNTRIES, et en change en cours de route.
      HEALTH_VPN_DURATION_INITIAL: "30s"
    # WIREGUARD_PRIVATE_KEY + WIREGUARD_ADDRESSES : rendu par pre_deploy (sops -d).
    env_file:
      - .env
    volumes:
      - /data/seedbox/gluetun:/gluetun
      - ./set-rtorrent-port.sh:/gluetun/set-rtorrent-port.sh:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      # L'UI ruTorrent vit dans le netns de gluetun : c'est donc gluetun qui porte
      # les labels Traefik. TLS + forward-auth Authelia sont assurés côté VPS.
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Le `.service=` explicite est OBLIGATOIRE dès qu'un conteneur porte plus
      # d'un service : Traefik refuse alors de deviner et laisse le routeur mort
      # (« Router seedbox cannot be linked automatically with multiple Services »),
      # ce qui se traduit par un 404 sur le domaine.
      - "traefik.http.routers.seedbox.rule=Host(`seedbox.vindiesel.vip`)"
      - "traefik.http.routers.seedbox.entrypoints=web"
      - "traefik.http.routers.seedbox.service=seedbox"
      - "traefik.http.services.seedbox.loadbalancer.server.port=8080"
      # Sonarr et Prowlarr partagent cette pile réseau : leurs routeurs vivent
      # donc aussi sur ce conteneur, chacun vers son port.
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.vindiesel.vip`)"
      - "traefik.http.routers.sonarr.entrypoints=web"
      - "traefik.http.routers.sonarr.service=sonarr"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.vindiesel.vip`)"
      - "traefik.http.routers.prowlarr.entrypoints=web"
      - "traefik.http.routers.prowlarr.service=prowlarr"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # rTorrent + ruTorrent (nginx + php-fpm dans la même image).
  rtorrent:
    container_name: seedbox_rtorrent
    image: crazymax/rtorrent-rutorrent:5.3.12-0.16.21@sha256:2ea0aadaa8f09d86d6b12a4b10bdeb1c58be42bf86dbc3c9775e9d412e6a6fdf
    # Pas de réseau propre : partage la pile réseau de gluetun (donc du VPN).
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: "Europe/Paris"
      PUID: "1000"
      PGID: "1000"
      # Port d'écoute de repli ; écrasé par set-rtorrent-port.sh dès que Proton
      # a attribué un port (cf. VPN_PORT_FORWARDING_UP_COMMAND ci-dessus).
      RT_INC_PORT: "50000"
      RT_DHT_PORT: "6881"
      RT_LOG_LEVEL: "info"
      RT_SESSION_SAVE_SECONDS: "1800"
      # Traefik (VPS puis local) est devant : on fait confiance à X-Forwarded-For.
      REAL_IP_FROM: "0.0.0.0/0"
      REAL_IP_HEADER: "X-Forwarded-For"
      UPLOAD_MAX_SIZE: "64M"
    volumes:
      # Config + session rTorrent et ruTorrent : sur le disque seedbox (avec les données).
      - /srv/seedbox/config:/data
      - /srv/seedbox/data:/downloads
      # htpasswd nginx. Laissé vide : l'authentification est faite par Authelia.
      - /srv/seedbox/passwd:/passwd
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Suivi des séries : sait ce qui manque, cherche via Prowlarr, puis IMPORTE par
  # lien dur depuis downloads/complete vers media/ — rTorrent continue donc de
  # seeder le fichier d'origine, sans duplication d'octets.
  sonarr:
    container_name: seedbox_sonarr
    image: linuxserver/sonarr:4.0.19@sha256:4d9df314875e1249ab7d6170c2b9b3dc1d8e6383f168ceb10dc9a5ad9b324739
    # Même pile réseau que rTorrent : l'API XMLRPC est sur 127.0.0.1, et surtout
    # les requêtes aux trackers sortent par le VPN.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: "Europe/Paris"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - /data/sonarr:/config
      # UN SEUL montage, identique a celui de rTorrent. Deux bind mounts separes
      # apparaissent au noyau comme deux peripheriques distincts vu du conteneur :
      # le lien dur echoue alors en « Cross-device link » et Sonarr RECOPIE en
      # silence, doublant l'espace disque. La bibliotheque vit donc SOUS ce montage,
      # en /downloads/media/, et non dans un montage a part.
      - /srv/seedbox/data:/downloads
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Gestionnaire d'indexeurs : centralise les trackers et les expose à Sonarr.
  prowlarr:
    container_name: seedbox_prowlarr
    image: linuxserver/prowlarr:2.5.2@sha256:c7502a75b021d964481c129c84590b9cbc40f83aadd4e553f173871bc0deaa3c
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: "Europe/Paris"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - /data/prowlarr:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    name: proxy
    external: true
