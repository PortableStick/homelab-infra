services:
  traefik:
    image: traefik:v3.7.13@sha256:1c32e7c368204fd72812152ebdd2ac0425993df6fd982317deb02e48f2d5423c
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    # Bind sur la seule IP tailnet : rien n'est joignable depuis le LAN maison.
    ports:
      - "100.92.25.102:80:80"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  # external: true — le réseau est créé une fois par scripts/bootstrap-tyron.sh, comme
  # `frontend` sur le VPS. Sans ça, Compose voudrait le créer et le posséder : le deploy
  # échoue avec « network proxy was found but has incorrect label » dès que le réseau
  # préexiste, et un `compose down` sur Traefik le supprimerait sous les pieds des
  # autres stacks (seedbox, jellyfin, filestash) qui, elles, le déclarent externe.
  proxy:
    name: proxy
    external: true
