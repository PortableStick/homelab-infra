name: filestash

services:
  filestash:
    container_name: filestash
    image: machines/filestash:latest@sha256:1494ecd798d17e2c8c534b559dd8059db1f0c1e84a05a66d96f9c177b70916e3
    networks:
      - proxy
    environment:
      TZ: "Europe/Paris"
      APPLICATION_URL: "filestash.vindiesel.vip"
      # Pas de télémétrie / pas de check de version sortant.
      CANARY: "false"
    volumes:
      # Config + base de l'admin Filestash (mot de passe admin, backends déclarés).
      - /data/filestash:/app/data/state
      # Vue volontairement restreinte : on NE monte PAS /srv/seedbox en entier.
      # Le backend local pointe sur /srv/seedbox, qui ne contient donc ici que
      # les deux dossiers que l'opérateur a une raison de manipuler :
      #   data/  -> temp/ (en cours), complete/ (seedés) et media/ (bibliothèque)
      #   watch/     -> dépôt de .torrent, ramené ici depuis config/rtorrent/watch
      # Restent invisibles : la session rTorrent et la config ruTorrent, dont une
      # suppression accidentelle casserait les torrents en cours.
      - /srv/seedbox/data:/srv/seedbox/data
      - /srv/seedbox/config/rtorrent/watch:/srv/seedbox/watch
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.filestash.rule=Host(`filestash.vindiesel.vip`)"
      - "traefik.http.routers.filestash.entrypoints=web"
      - "traefik.http.services.filestash.loadbalancer.server.port=8334"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    name: proxy
    external: true
